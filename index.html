<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
body { font-family: sans-serif; display:flex; justify-content:center; margin-top:40px; background:#f2f2f2; }
.calc { background:white; padding:20px; border-radius:15px; box-shadow:0 4px 10px rgba(0,0,0,0.2); width:250px; }
#display { width:100%; height:50px; font-size:24px; text-align:right; margin-bottom:10px; border:1px solid #ccc; border-radius:8px; padding:5px; }
.buttons { display:grid; grid-template-columns: repeat(4,1fr); gap:10px; }
button { height:50px; font-size:20px; border:none; border-radius:8px; background:#e0e0e0; }
button.op { background:#ff9800; color:white; }
button.eq { background:#4caf50; color:white; }
button.clr { background:#f44336; color:white; }
</style>
</head>
<body>
<div class="calc">
<input id="display" disabled>
<div class="buttons">
<button class="clr" onclick="clearDisplay()">C</button>
<button onclick="appendValue('/')">/</button>
<button onclick="appendValue('*')">*</button>
<button onclick="backspace()">⌫</button>
<button onclick="appendValue('7')">7</button>
<button onclick="appendValue('8')">8</button>
<button onclick="appendValue('9')">9</button>
<button onclick="appendValue('-')">-</button>
<button onclick="appendValue('4')">4</button>
<button onclick="appendValue('5')">5</button>
<button onclick="appendValue('6')">6</button>
<button onclick="appendValue('+')" class="op">+</button>
<button onclick="appendValue('1')">1</button>
<button onclick="appendValue('2')">2</button>
<button onclick="appendValue('3')">3</button>
<button onclick="calculate()" class="eq">=</button>
<button onclick="appendValue('0')">0</button>
<button onclick="appendValue('.')">.</button>
</div>
</div>
<script>
let display = document.getElementById('display');
function appendValue(v){ display.value += v; }
function clearDisplay(){ display.value = ''; }
function backspace(){ display.value = display.value.slice(0,-1); }
function calculate(){ try{ display.value = eval(display.value); } catch{ display.value='Error'; } }
</script>
</body>
</html>
